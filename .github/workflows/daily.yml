name: Daily update & deploy

on:
  schedule:
    # 02:00 UTC ≈ 04:00-05:00 Asia/Jerusalem, after "yesterday" has fully ended there.
    - cron: "0 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Ingest -> commit data -> build -> upload the Pages artifact.
  # Kept separate from `deploy` so a transient Pages failure can be retried with
  # "Re-run failed jobs" without re-running ingestion or pushing again.
  update-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Check out the branch tip, not the SHA the run was created for. A re-run
          # replays the original SHA by default, so if an earlier attempt already
          # pushed a data commit, the new commit would be rejected as non-fast-forward.
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ingestion/requirements.txt

      - name: Install ingestion dependencies
        run: pip install -r ingestion/requirements.txt

      - name: Run ingestion (tzevaadom + ACLED -> SQLite -> JSON exports)
        env:
          ACLED_EMAIL: ${{ secrets.ACLED_EMAIL }}
          ACLED_PASSWORD: ${{ secrets.ACLED_PASSWORD }}
        run: python -m ingestion.run

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/atlas.sqlite frontend/public/data/*.json
          git diff --cached --quiet || git commit -m "chore(data): daily ingestion update"
          # Pick up anything pushed to the branch while ingestion ran (e.g. a code
          # commit). Data files are only written by this job, so this rebases cleanly.
          git pull --rebase --autostash origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: update-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy-retry.outputs.page_url }}
    steps:
      # deploy-pages sometimes can't see an artifact that was uploaded seconds earlier
      # ("No artifacts named github-pages were found"). Retry once after a pause
      # instead of failing the whole daily run.
      - name: Deploy to GitHub Pages
        id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retrying deploy
        if: steps.deploy.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages (retry)
        id: deploy-retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
